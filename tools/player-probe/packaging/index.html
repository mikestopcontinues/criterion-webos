<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'">
<title>Criterion lifetime probe</title>
<style>
body{background:#121212;color:#eee;font:32px sans-serif;margin:96px;line-height:1.5}h1{font-size:52px}button{font:inherit;background:#333;color:#fff;border:4px solid #777;padding:20px;margin:12px}button:focus{outline:6px solid #fff}#status{min-height:110px}#capabilities{font-size:24px;color:#aaa}
#eme-results{font-size:20px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<script src="webOSTV.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<h1>Criterion lifetime probe</h1>
<p id="status" role="status">Connecting to fixed broker…</p>
<button id="transfer">Open paired app</button><button id="ping">Ping</button><button id="close">Stop and reap</button>
<p id="capabilities"></p>
<button id="eme" disabled hidden>Check Widevine access</button>
<pre id="eme-results" hidden>Not run. Access may initialize DRM. No media or license request.</pre>
<p>UI Back stops the broker and exits. Player Back returns to UI. The broker ends after two minutes.</p>
</body>
</html>
