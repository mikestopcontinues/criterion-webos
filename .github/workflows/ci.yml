name: Verify Rust and native ABI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned development environment
        run: ./dev image
      - name: Audit locked Rust dependencies
        shell: bash
        run: |
          mkdir -p .local/checks/dependency-audit
          set +e
          docker run --rm --init --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount type=volume,src=criterion-webos-audit-cargo,dst=/cargo \
            --mount type=volume,src=criterion-webos-audit-target,dst=/target \
            --mount "type=bind,src=$PWD/Cargo.lock,dst=/workspace/Cargo.lock,readonly" \
            --workdir /tmp --env CARGO_BUILD_JOBS=2 \
            criterion-webos-development:20261009 sh -ec '
              cargo +nightly-2026-07-02 install cargo-audit --version 0.22.2 \
                --locked --no-default-features --root /cargo/audit-tools --jobs 2 >&2
              /cargo/audit-tools/bin/cargo-audit --version >&2
              /cargo/audit-tools/bin/cargo-audit audit --file /workspace/Cargo.lock \
                --db /cargo/advisory-db --json --deny warnings
            ' > .local/checks/dependency-audit/report.json
          task_audit_exit=$?
          set -e
          cat .local/checks/dependency-audit/report.json
          sha256sum Cargo.lock .local/checks/dependency-audit/report.json
          printf 'Dependency audit exit: %s\n' "$task_audit_exit"
          exit "$task_audit_exit"
      - name: Format
        run: ./dev cargo fmt --all -- --check
      - name: Behavior and ownership tests
        run: ./dev cargo test --workspace --all-features --locked
      - name: Host SDL startup behavior
        run: ./dev cargo test -p criterion-platform --features sdl --locked
      - name: Native SDL input and GLES frame E2E
        run: >-
          ./dev run xvfb-run -a -s '-screen 0 1920x1080x24'
          env SDL_VIDEO_X11_FORCE_EGL=1 cargo test -p criterion-app
          --bin criterion-unofficial --features sdl --locked
          native_window_input_and_search_frame_present_end_to_end
          -- --ignored --nocapture --test-threads=1
      - name: Diagnostics
        run: ./dev cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned ARM64-host webOS SDK environment
        run: ./dev native-image
      - name: Cross-link platform test executables
        run: ./dev native cargo test -p criterion-platform --target arm-unknown-linux-gnueabi -Z build-std=std,panic_abort,panic_unwind --features webos --no-run --locked
      - name: Cross-link the native application, packaged broker and native caller
        run: >-
          ./dev native cargo build -p criterion-app -p criterion-broker-probe -p criterion-native-caller-probe
          --features criterion-app/webos,criterion-broker-probe/webos,criterion-native-caller-probe/webos --target arm-unknown-linux-gnueabi
          -Z build-std=std,panic_abort -Z build-std-features=compiler-builtins-mem
          --release --locked
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned CPU broker environment
        run: ./dev image
      - name: Compile the real broker used by Node behavior tests
        run: >-
          mkdir -p .local/player-probe &&
          ./dev run rustc --edition=2024 --deny warnings tools/player-probe/broker/src/main.rs
          -o .local/player-probe/criterion-broker-probe
      - name: Build pinned host packaging and TV Node environment
        run: docker build -t criterion-player-probe-tools:20261009 tools/player-probe
      - name: Prepare locked host tooling
        run: >-
          docker run --rm --init --mount type=bind,src="$PWD",dst=/workspace
          --workdir /workspace/tools/player-probe criterion-player-probe-tools:20261009
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check real process ownership and package admission offline
        run: >-
          docker run --rm --init --network none --mount type=bind,src="$PWD",dst=/workspace
          --workdir /workspace/tools/player-probe criterion-player-probe-tools:20261009
          sh -c 'npm run compile && npm test &&
          node node_modules/typescript/bin/tsc -p ../package-native/tsconfig.json &&
          /opt/node16/bin/node ../../.local/native-package/compiled/tools/package-native/tests/run.js &&
          node node_modules/typescript/bin/tsc -p ../native-deployment/tsconfig.json &&
          /opt/node16/bin/node ../../.local/native-deployment/compiled/tests/prerequisites.test.js &&
          /opt/node16/bin/node ../../.local/native-deployment/compiled/tests/bounds.test.js'
      - name: Check corresponding-source fixtures offline
        run: >-
          docker run --rm --init --network none --mount type=bind,src="$PWD",dst=/workspace
          --workdir /workspace criterion-player-probe-tools:20261009
          sh -c 'node tools/player-probe/node_modules/typescript/bin/tsc
          -p tools/source-distribution/tsconfig.json --outDir /tmp/source-distribution-checked &&
          /opt/node16/bin/node /tmp/source-distribution-checked/tools/source-distribution/tests/run.js'
