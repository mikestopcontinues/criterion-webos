[package]
name = "criterion-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[features]
default = []
sdl = ["criterion-platform/sdl"]
webos = ["sdl", "criterion-platform/webos"]

[dependencies]
criterion-platform = { path = "../criterion-platform" }
criterion-artwork = { path = "../criterion-artwork" }
criterion-provider = { path = "../criterion-provider" }
criterion-session = { path = "../criterion-session" }
criterion-ui = { path = "../criterion-ui" }
aws-lc-rs = "=1.18.1"
egui = { version = "=0.36.2", default-features = false }
glow = "=0.17.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[[bin]]
name = "criterion-unofficial"
path = "src/main.rs"
required-features = ["sdl"]
