[package]
name = "criterion-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"
description = "Owned stock SDL2 window and input for Criterion Unofficial"

[features]
default = []
sdl = []
webos-runtime = []
webos = ["sdl", "webos-runtime"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
