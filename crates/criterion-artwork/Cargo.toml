[package]
name = "criterion-artwork"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
criterion-provider = { path = "../criterion-provider" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "=1.0.9"
url = "=2.5.8"
tokio = { version = "=1.53.2", features = ["sync", "rt"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "=1.53.2", features = ["macros", "rt", "time"] }
