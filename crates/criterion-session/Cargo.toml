[package]
name = "criterion-session"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bytes = "=1.12.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "=1.0.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
url = "=2.5.8"
zeroize = "=1.9.1"
tokio = { version = "=1.53.2", features = ["sync"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "=1.53.2", features = ["macros", "rt", "time", "sync"] }
