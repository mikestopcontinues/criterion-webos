[package]
name = "egui_glow"
version = "0.36.2"
edition = "2024"
rust-version = "1.95"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/emilk/egui"
description = "Pinned egui glow painter with deterministic GL resource cleanup"
[features]
default = []
[dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck"] }
glow = "=0.17.0"
bytemuck = "1.25"
log = "0.4"
profiling = "1.0"
